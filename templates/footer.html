      <script>
        function increaseQty(btn) {
            let qty = btn.parentElement.querySelector(".qty-input");
            qty.value = parseInt(qty.value || 1) + 1;
        }

        function decreaseQty(btn) {
            let qty = btn.parentElement.querySelector(".qty-input");
            let val = parseInt(qty.value || 1);

            if (val > 1) {
                qty.value = val - 1;
            }
        }
      </script>
    </div>
  </div>
</div>
