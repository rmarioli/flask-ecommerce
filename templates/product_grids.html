{% include "header.html" %}



 <!-- Featured Products - 5 Item Carousel -->
<div class="container">
  <h5 class="fw-normal">{{ category }}</h5><br>
  <hr class="mb-4">
  <div class="row g-4">

    {% for item in all_products %}

      <div class="col-12 col-sm-6 col-md-4">
        <a href="{{ url_for('product', prod_id=item.id) }}">
          <div class="card h-100 border-0">

            <img src="{{ item.image_url or 'https://mdbootstrap.com/img/Photos/Square/img(4).jpg' }}"
                 class="card-img-top"
                 style="height: 260px; object-fit: cover;"
                 alt="{{ item.name }}">

            <div class="card-body text-center py-2">
              <div class="fw-semibold">{{ item.name }}</div>
              <div class="text-purple">{{ item.price }} $</div>
            </div>

          </div>
        </a>
      </div>

    {% endfor %}

  </div>
</div>

{% include "footer.html" %}
